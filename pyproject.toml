[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
