services:
  turismo-backend:
    build:
      context: ./
    container_name: turismo-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - turismo_data:/data
    networks:
      proxy_network:
        aliases:
          - turismo-backend

volumes:
  turismo_data:

networks:
  proxy_network:
    external: true
    name: proxy_network
